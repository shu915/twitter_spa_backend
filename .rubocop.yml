require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-hc
Style/Documentation:
  Enabled: false
AllCops:
  NewCops: enable
RSpec/MultipleExpectations:
  Max: 2
Metrics/MethodLength:
  Max: 40
Metrics/BlockLength:
  Max: 30
Metrics/AbcSize:
  Max: 40
Rails/I18nLocaleTexts:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 10
Rails/SkipsModelValidations:
  Enabled: false
Layout/LineLength:
  Max: 200
RailsSpecificActionName:
  Enabled: false
Metrics/ClassLength:
  Max: 150
