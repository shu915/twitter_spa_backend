require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-hc
Style/Documentation:
  Enabled: false
AllCops:
  NewCops: enable
RSpec/MultipleExpectations:
  Max: 2
Metrics/MethodLength:
  Max: 40
Metrics/BlockLength:
  Max: 30
Layout/LineLength:
  Max: 150
Metrics/AbcSize:
  Max: 30
Rails/I18nLocaleTexts:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 10
